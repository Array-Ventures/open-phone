[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openphone"
version = "0.1.0"
description = "Physical iPhone control through USB capture and Bluetooth HID"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

[project.scripts]
openphone = "openphone.cli:main"

[project.optional-dependencies]
video = ["aiortc==1.15.0", "av==17.1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"openphone.services" = ["assets/*.html", "assets/*.css", "assets/*.js"]
